# Used as compose.override.yaml on the stress-test machine (32 GB, 8 cores).
# PostgreSQL's defaults are sized for a small machine (128 MB of shared buffers); an
# operator of 5,000 people would set these. pg_stat_statements shows the costly queries.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
    shm_size: 1gb
  diffluence:
    environment:
      DIFFLUENCE_EXAMPLE_SPACE: ${DIFFLUENCE_EXAMPLE_SPACE:-true}
