# SPDX-License-Identifier: Apache-2.0
# A release (spec 057). Runs only when a tag vX.Y.Z is pushed: never on a pull request or a
# branch. Builds the archives, .deb and .rpm with GoReleaser, the image for amd64 and arm64,
# SBOMs for both, signs keylessly with Sigstore, attests SLSA provenance, and leaves a draft
# release for a maintainer to read and publish. Every action is pinned by commit SHA.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release and its files
      packages: write # the image on ghcr.io
      id-token: write # keyless signing and attestations
      attestations: write
    env:
      GORELEASER_VERSION: v2.20.1
      COSIGN_VERSION: v3.1.4
      SYFT_VERSION: v1.57.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release comes from main only.
      - name: the tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: web assets, embedded in the binary
        run: npm ci --no-fund --no-audit && npx vite build
        working-directory: web

      # The notes are the part of CHANGELOG.md under this version.
      - name: release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { inside = ($0 ~ "^## \\[?v?" v "\\]?([ (]|$)") ; next }
            inside { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

      - name: owner of the image, in lower case
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: provenance of every released file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The image: the same Dockerfile as CI, for amd64 and arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: commit date
        run: echo "BUILD_DATE=$(git log -1 --format=%cs)" >> "$GITHUB_ENV"
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/diffluence:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          sbom: true
          provenance: mode=max
      - name: sign the image
        run: cosign sign --yes "ghcr.io/${IMAGE_OWNER}/diffluence@${DIGEST}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
      - name: provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_OWNER }}/diffluence
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: SBOM of the image, on the release
        run: |
          image="ghcr.io/${IMAGE_OWNER}/diffluence@${DIGEST}"
          syft scan "$image" --output "spdx-json=dist/diffluence_${GITHUB_REF_NAME#v}_image.spdx.json" \
            --output "cyclonedx-json=dist/diffluence_${GITHUB_REF_NAME#v}_image.cdx.json"
          gh release upload "$GITHUB_REF_NAME" dist/*_image.spdx.json dist/*_image.cdx.json
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
