# SPDX-License-Identifier: Apache-2.0
# Every gate here must pass before a pull request can be merged.
# Renovate pins the actions below to commit SHAs (see renovate.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: fuzzing, mutation check and restore drill

permissions:
  contents: read

# The nightly run has a group of its own: a push to main must not cancel it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sh scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: format
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: vulnerabilities
        run: make vuln
      - name: tests (race detector, integration against PostgreSQL)
        run: make test-race
      - name: build
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install
        run: npm ci --no-fund --no-audit
        working-directory: web
      - name: types, lint, translation strings, unit tests
        run: make web-check
      - run: make collab-check
      - name: known vulnerabilities in shipped packages
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: licences
        run: make licenses

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - name: start the development containers
        run: bash scripts/dev up
      - name: install frontend packages
        run: bash scripts/dev sh -c "cd web && npm ci --no-fund --no-audit"
      - name: real binary, real PostgreSQL, real Chromium, accessibility checks
        run: bash scripts/e2e

  # Blueprint 07, rule 2: the release before keeps serving while this one migrates
  # the same database, and still runs on it afterwards, as a rollback does.
  upgrade:
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: release N and N+1 side by side on one database
        env:
          # The target branch of a pull request, or main before this push. Empty on
          # a schedule, and then the script takes the commit before.
          RELEASE_N: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/upgrade-check.sh "$RELEASE_N"

  container:
    runs-on: ubuntu-latest
    needs: go
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -t diffluence:ci .
      - name: build the image of the backup service (spec 054)
        run: docker build --target backup -t diffluence-backup:ci .
      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: diffluence:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # ADR-038: a ZAP baseline against the real image, as a browser would reach it.
      - name: start the image for ZAP
        run: |
          docker run -d --name diffluence --network host \
            -e DIFFLUENCE_DATABASE_URL='postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable' \
            -e DIFFLUENCE_PUBLIC_URL=http://localhost:8080 diffluence:ci
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/readyz >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8080/readyz
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          fail_action: true
          allow_issue_writing: false
      - name: server log, when something failed
        if: failure()
        run: docker logs diffluence 2>&1 | tail -50

  # ADR-038: Semgrep's rules for Go, TypeScript, React and secrets. A finding fails the
  # build; an exception is a nosemgrep comment on the line, with the reason above it.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@v5
      - name: scan
        run: >-
          semgrep scan --metrics=off --error
          --config p/golang --config p/typescript --config p/react --config p/secrets
          --exclude internal/webui/dist

  # ADR-038: CodeQL with its extended security queries. A finding fails the build.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
            pack: go
          - language: javascript-typescript
            build-mode: none
            pack: javascript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # The suppression query turns a codeql[rule] comment above a line into a suppression.
          # A query inside a pack is named through packs; queries only takes suites and paths.
          packs: codeql/${{ matrix.pack }}-queries:AlertSuppression.ql
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          # A pull request from a fork may not write to code scanning; the check below still runs.
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}
      # A result counts unless a `codeql[rule]` comment above its line, with the reason, suppresses it.
      - name: no findings
        run: |
          open='.runs[].results[] | select((.suppressions // []) | length == 0)'
          found=$(jq "[$open] | length" codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          if [ "$found" -gt 0 ]; then
            jq -r "$open"' | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
            echo "CodeQL found $found problem(s)"
            exit 1
          fi

  # Spec 057: a release still builds, installs and reproduces. Not on pull requests, so a
  # review is not held up by it (D5); on main after every push, and at night.
  release-dry-run:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: the binary and the web assets reproduce
        run: bash scripts/reproducible.sh
      - name: web assets, embedded in the binary
        run: npm ci --no-fund --no-audit && npx vite build
        working-directory: web
      - name: the release configuration is valid
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: check
      - name: archives and packages, twice
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --snapshot --clean --skip=sign,sbom
      # Outside the checkout: Go stamps the binary with vcs.modified=true when any untracked
      # file sits in the tree, so a copy kept inside made the second build differ (spec 065).
      - name: keep the first run
        run: mv dist "$RUNNER_TEMP/dist-first"
      - name: the checkout is clean, as a release builds from it
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain | while IFS= read -r line; do echo "::error title=not clean::$line"; done
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --snapshot --clean --skip=sign,sbom
      # A difference becomes an annotation naming the file and, for a binary, the build
      # settings Go recorded in it, so the cause can be read from the run itself.
      - name: the two runs are the same, byte for byte
        run: |
          first="$RUNNER_TEMP/dist-first"
          if diff "$first/checksums.txt" dist/checksums.txt >checksums.diff; then exit 0; fi
          grep -E '^[<>]' checksums.diff | while IFS= read -r line; do
            echo "::error title=not reproducible::$line"
          done || true
          for f in $(grep -E '^<' checksums.diff | awk '{print $3}'); do
            case "$f" in
              *.tar.gz)
                mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
                tar -xzf "$first/$f" -C "$RUNNER_TEMP/a" diffluence && tar -xzf "dist/$f" -C "$RUNNER_TEMP/b" diffluence &&
                  diff <(go version -m "$RUNNER_TEMP/a/diffluence") <(go version -m "$RUNNER_TEMP/b/diffluence") | head -8 |
                  while IFS= read -r line; do echo "::error title=$f::$line"; done || true
                rm -rf "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" ;;
            esac
          done
          exit 1
      - name: the .deb installs on Debian and the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 sh -c \
            'dpkg -i /dist/*_amd64.deb && id diffluence && test -d /var/lib/diffluence && diffluence version'
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41 sh -c \
            'rpm -i /dist/*_amd64.rpm && id diffluence && test -d /var/lib/diffluence && diffluence version'

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: fuzz the parsers
        run: make fuzz
      # Nine mutations break frontend rules, and their tests need the web dependencies.
      - name: web dependencies
        run: npm ci --no-fund --no-audit
        working-directory: web
      # Mutations of the service for editing together run its own tests.
      - name: collab dependencies
        run: npm ci --no-fund --no-audit
        working-directory: collab
      # Every mutation that is not caught becomes an annotation, readable without the log.
      - name: do the tests catch injected bugs?
        run: |
          # The step shell stops at the first failure, so the status is kept instead.
          status=0
          make mutation 2>&1 | tee mutation.txt || status=$?
          grep -vE '^(caught|running|all mutations)' mutation.txt | grep -E '^[A-Z]+ ' | head -40 |
            while IFS= read -r line; do echo "::error title=mutation::$line"; done || true
          tail -1 mutation.txt
          exit "$status"
      - name: can an encrypted backup be restored on a clean installation?
        run: bash scripts/restore-drill.sh
