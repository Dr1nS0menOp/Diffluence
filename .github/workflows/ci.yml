# SPDX-License-Identifier: Apache-2.0
# Every gate here must pass before a pull request can be merged.
# Renovate pins the actions below to commit SHAs (see renovate.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: fuzzing and mutation check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sh scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: format
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: make staticcheck
      - name: vulnerabilities
        run: make vuln
      - name: tests (race detector, integration against PostgreSQL)
        run: make test-race
      - name: build
        run: make build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install
        run: npm ci --no-fund --no-audit
        working-directory: web
      - name: types, lint, translation strings, unit tests
        run: make web-check
      - run: make collab-check
      - name: known vulnerabilities in shipped packages
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: licences
        run: make licenses

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - name: start the development containers
        run: bash scripts/dev up
      - name: install frontend packages
        run: bash scripts/dev sh -c "cd web && npm ci --no-fund --no-audit"
      - name: real binary, real PostgreSQL, real Chromium, accessibility checks
        run: bash scripts/e2e

  container:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -t diffluence:ci .
      - name: scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: diffluence:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diffluence
          POSTGRES_PASSWORD: diffluence
          POSTGRES_DB: diffluence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffluence"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@localhost:5432/diffluence?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: fuzz the parsers
        run: make fuzz
      - name: do the tests catch injected bugs?
        run: make mutation
