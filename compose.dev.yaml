# SPDX-License-Identifier: Apache-2.0
# Development environment. Everything runs in containers, so the host only needs
# Docker. Start it with: scripts/dev up    (see docs/development.md)
#
# Do NOT use this for real data: the database runs without crash safety for speed.
name: diffluence-dev

services:
  db:
    # Pinned by digest, the same as compose.yaml: a tag that moves would recreate the
    # test database in the middle of a run.
    image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
    environment:
      POSTGRES_USER: diffluence
      POSTGRES_PASSWORD: diffluence
      POSTGRES_DB: diffluence
    # Fast and unsafe on purpose; tests create and drop many databases.
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      -c max_connections=500 -c shared_buffers=256MB
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffluence"]
      interval: 2s
      retries: 30

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DIFFLUENCE_TEST_DATABASE_URL: postgres://diffluence:diffluence@db:5432/diffluence?sslmode=disable
      GOCACHE: /cache/go-build
      GOMODCACHE: /cache/go-mod
      npm_config_cache: /cache/npm
    volumes:
      - .:/work
      - cache:/cache
      - prev:/prev
      - web_modules:/work/web/node_modules
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${DEV_VITE_PORT:-15173}:5173"

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    network_mode: service:dev
    working_dir: /work/web
    environment:
      CI: "1"
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}
    volumes:
      - .:/work
      - web_modules:/work/web/node_modules

  # Catches all mail in a web screen, so nothing leaves the machine. Optional: it only
  # starts with this profile. See "Mail while developing" in docs/development.md.
  # The helper for PDF files (spec 014). Optional: start it with --profile pdf.
  pdf:
    image: gotenberg/gotenberg:8
    profiles: [pdf]

  mailpit:
    image: axllent/mailpit:v1.33.0
    profiles: [mail]
    ports:
      - "127.0.0.1:${DEV_MAIL_PORT:-18025}:8025"

volumes:
  cache:
  prev:
  web_modules:
